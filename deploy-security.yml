---
- name: Déploiement des politiques de sécurité (RBAC & Network Policies)
  hosts: master
  become: true
  tasks:
    - name: Copier le manifeste de sécurité
      copy:
        src: security-demo-apps.yml
        dest: /tmp/security-demo-apps.yml
        mode: '0644'

    - name: Appliquer les règles de sécurité via kubectl
      command: kubectl apply -f /tmp/security-demo-apps.yml
