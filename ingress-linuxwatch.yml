apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linuxwatch-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: linuxwatch.local
    http:
      paths:
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: linuxwatch-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: linuxwatch-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: linuxwatch-frontend-service
            port:
              number: 80
