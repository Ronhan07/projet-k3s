apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-application
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mon-application
  template:
    metadata:
      labels:
        app: mon-application
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mon-application-service
  namespace: dev
spec:
  selector:
    app: mon-application
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
