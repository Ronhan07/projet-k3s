---
# 1. SECRET KUBERNETES POUR LES MOTS DE PASSE
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: demo-apps
type: Opaque
stringData:
  mysql-root-password: "{{ vault_mysql_root_password }}"
  mysql-password: "{{ vault_mysql_password }}"

---
# 2. STOCKAGE PERSISTANT POUR MYSQL ET WORDPRESS
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: demo-apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
  namespace: demo-apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# 3. DÉPLOIEMENT MYSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: "wordpress"
        - name: MYSQL_USER
          value: "wpuser"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: mysql-password
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: demo-apps
spec:
  ports:
  - port: 3306
  selector:
    app: mysql

---
# 4. DÉPLOIEMENT WORDPRESS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
      - name: wordpress
        image: wordpress:latest
        env:
        - name: WORDPRESS_DB_HOST
          value: "mysql-svc:3306"
        - name: WORDPRESS_DB_USER
          value: "wpuser"
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secrets
              key: mysql-password
        - name: WORDPRESS_DB_NAME
          value: "wordpress"
        - name: WORDPRESS_CONFIG_EXTRA
          value: |
            define('WP_SITEURL', 'https://' . $_SERVER['HTTP_HOST'] . '/app2');
            define('WP_HOME', 'https://' . $_SERVER['HTTP_HOST'] . '/app2');
        ports:
        - containerPort: 80
        volumeMounts:
        - name: wordpress-storage
          mountPath: /var/www/html
      volumes:
      - name: wordpress-storage
        persistentVolumeClaim:
          claimName: wordpress-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-svc
  namespace: demo-apps
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: wordpress

---
# 5. MIDDLEWARE TRAEFIK POUR RETIRER /app2
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-app2-prefix
  namespace: demo-apps
spec:
  stripPrefix:
    prefixes:
      - /app2

---
# 6. INGRESS TRAEFIK AVEC HTTPS & CERT-MANAGER
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress-ingress
  namespace: demo-apps
  annotations:
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    traefik.ingress.kubernetes.io/router.middlewares: demo-apps-strip-app2-prefix@kubernetescrd
spec:
  tls:
  - hosts:
    - "192.168.69.10"
    secretName: wordpress-tls-cert
  rules:
  - http:
      paths:
      - path: /app2
        pathType: Prefix
        backend:
          service:
            name: wordpress-svc
            port:
              number: 80
