---
# 1. RBAC : Compte de service en lecture seule dans le namespace demo-apps
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-user
  namespace: demo-apps

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: demo-apps
  name: demo-pod-reader
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "services", "deployments"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-demo-pod-reader
  namespace: demo-apps
subjects:
- kind: ServiceAccount
  name: readonly-user
  namespace: demo-apps
roleRef:
  kind: Role
  name: demo-pod-reader
apiGroup: rbac.authorization.k8s.io

---
# 2. Network Policy : Isolation de MySQL (Seul WordPress peut s'y connecter)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-mysql-db
  namespace: demo-apps
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: wordpress
    ports:
    - protocol: TCP
      port: 3306
