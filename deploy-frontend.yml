apiVersion: apps/v1
kind: Deployment
metadata:
  name: linuxwatch-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linuxwatch-frontend
  template:
    metadata:
      labels:
        app: linuxwatch-frontend
    spec:
      containers:
      - name: linuxwatch-frontend
        image: linuxwatch-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: linuxwatch-frontend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: linuxwatch-frontend
  ports:
  - port: 80
    targetPort: 80
