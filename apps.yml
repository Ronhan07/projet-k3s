---
# 1. ESPACE DE TRAVAIL
apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps

---
# 2. APPLICATION WEB DE DÉMONSTRATION (NGINX)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: demo-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
      - name: nginx
        image: nginxdemos/hello
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web-demo-svc
  namespace: demo-apps
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: web-demo

---
# 3. ROUTAGE TRAEFIK POUR /app1
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-demo-ingress
  namespace: demo-apps
spec:
  rules:
  - http:
      paths:
      - path: /app1
        pathType: Prefix
        backend:
          service:
            name: web-demo-svc
            port:
              number: 80
