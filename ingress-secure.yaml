apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-ingress
  namespace: dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - k3s-stage.local
    secretName: tls-secret
  rules:
  - host: k3s-stage.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mon-application-service
            port:
              number: 80
